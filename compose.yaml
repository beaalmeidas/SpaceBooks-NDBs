name: spacebooks-ndbs
services:
  mongodb:
    image: mongo:8.0
    entrypoint: ["bash", "/opt/spacebooks/mongo-entrypoint.sh"]
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-spacebooks}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run python -m src.configure_env first}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./docker/mongo-entrypoint.sh:/opt/spacebooks/mongo-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  mongo-init:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-spacebooks}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["mongosh", "--nodb", "--quiet", "/opt/spacebooks/mongo-init.js"]
    volumes:
      - ./docker/mongo-init.js:/opt/spacebooks/mongo-init.js:ro
    depends_on:
      mongodb:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python -m src.configure_env first}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run python -m src.configure_env first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 30s
  catalog:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements-app.txt
    profiles: ["app"]
    command: ["python", "-m", "streamlit", "run", "src/catalogo.py", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME:-spacebooks}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true
      MONGO_DATABASE: ${MONGO_DATABASE:-spacebooks}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-60}
      REDIS_CACHE_TIMEOUT_SECONDS: ${REDIS_CACHE_TIMEOUT_SECONDS:-0.25}
      REDIS_SESSION_TIMEOUT_SECONDS: ${REDIS_SESSION_TIMEOUT_SECONDS:-1}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-10}
      DB_QUERY_TIMEOUT_SECONDS: ${DB_QUERY_TIMEOUT_SECONDS:-60}
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
  tools:
    build: .
    profiles: ["tools"]
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME:-spacebooks}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true
      MONGO_DATABASE: ${MONGO_DATABASE:-spacebooks}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-10}
      DB_QUERY_TIMEOUT_SECONDS: ${DB_QUERY_TIMEOUT_SECONDS:-60}
    volumes:
      - ./data/prepared:/app/data/prepared
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
volumes:
  mongo_data:
  mongo_config:
  redis_data:
  neo4j_data:
